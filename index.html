<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#c9d6cc;--fg:#1d2433;--card:#dbe5dd;--bd:#8fa396;--turn:#c8362d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131c18;--fg:#e6eee8;--card:#1d2a24;--bd:#3d5348;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131c18;--fg:#e6eee8;--card:#1d2a24;--bd:#3d5348;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:48px;line-height:1;font-weight:800;letter-spacing:-.03em;margin:18px 0 6px}
.sub{opacity:.75;margin:0 0 20px;max-width:30ch}
.card{background:var(--card);border:2px solid var(--fg);border-radius:4px 20px 4px 20px;padding:14px 16px;margin:14px 0}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:99px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;margin:4px 6px 4px 0}button:focus-visible,textarea:focus-visible{outline:3px solid var(--turn);outline-offset:2px}
button.p{background:var(--fg);color:var(--bg)}
button:disabled{opacity:.4;cursor:default}
.big{display:block;width:100%;margin:8px 0}
textarea{width:100%;height:64px;font:12px monospace;border-radius:6px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);box-sizing:border-box}
label{display:block;font-size:13px;opacity:.75;margin-top:8px}
.st{font-size:13px;opacity:.8}input{font:800 36px 'Bricolage Grotesque',monospace;letter-spacing:.25em;text-align:center;width:100%;box-sizing:border-box;padding:8px;margin:6px 0;border:2px solid var(--fg);border-radius:6px;background:var(--bg);color:var(--fg);text-transform:uppercase}
canvas{width:100%;max-width:560px;aspect-ratio:1;display:block;margin:0 auto;border-radius:16px;border:8px solid var(--turn);box-sizing:border-box;transition:border-color .35s;touch-action:manipulation}@media (prefers-reduced-motion:reduce){canvas{transition:none}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 14px;border-radius:99px;color:#fff;font-size:16px;font-weight:800;margin-right:8px}
#dice{width:56px;height:56px;border-radius:13px;background:#fbfaf5;border:2px solid #1d2433;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;gap:3px;box-sizing:border-box}#dice i{border-radius:50%;background:#1d2433}
.hide{display:none}
</style></head><body><main>
<h1>Ludo</h1>
<p class="sub">Dua sampai empat pemain. Tanpa akun, tanpa server.</p>

<div id="menu">
 <div class="card"><b>Main di satu perangkat</b>
  <p class="st">Gantian pakai HP atau PC yang sama.</p>
  <button onclick="startLocal(2)">2 pemain</button><button onclick="startLocal(3)">3 pemain</button><button onclick="startLocal(4)">4 pemain</button></div>
 <div class="card"><b>Jadi host (online)</b>
  <p class="st">Kamu membuat ruangan dan mendapat kode. Teman tinggal memasukkan kode itu.</p>
  <button onclick="hostSetup(2)">2 pemain</button><button onclick="hostSetup(3)">3 pemain</button><button onclick="hostSetup(4)">4 pemain</button></div>
 <div class="card"><b>Gabung ke teman</b>
  <p class="st">Masukkan kode ruangan dari host.</p>
  <button class="p" onclick="show('join')">Gabung</button></div>
</div>

<div id="host" class="hide">
 <div class="card"><label>Kode ruangan. Bagikan ke teman.</label>
  <input id="rc" readonly aria-label="Kode ruangan">
  <button onclick="cp('rc')">Salin kode</button>
  <p class="st" id="rst">Membuat ruangan…</p></div>
 <button class="p" id="go" onclick="startHost()" disabled>Mulai permainan</button><button onclick="location.reload()">Batal</button>
</div>

<div id="join" class="hide">
 <div class="card"><label>Masukkan kode ruangan dari host</label>
  <input id="jc" maxlength="5" autocapitalize="characters" autocomplete="off" aria-label="Kode ruangan">
  <button class="p" onclick="doJoin()">Masuk ruangan</button>
  <p class="st" id="jst"></p></div>
 <button onclick="location.reload()">Batal</button>
</div>

<div id="game" class="hide">
 <div class="bar"><div id="who"></div><div style="display:flex;align-items:center;gap:8px"><div id="dice" role="img" aria-label="Dadu"></div><button class="p" id="rb" onclick="act('roll')">Lempar dadu</button></div></div>
 <canvas id="cv" width="600" height="600"></canvas>
 <p class="st" id="msg" style="text-align:center"></p>
 <div style="text-align:center"><button onclick="location.reload()">Keluar ke menu</button></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id),u=40;
const COL=['#c8362d','#2f8f4e','#e0a526','#2a62b8'],NAME=['Merah','Hijau','Kuning','Biru'];
const ST=[0,13,26,39],SAFE=new Set([0,8,13,21,26,34,39,47]);
const T=[];(()=>{for(let x=1;x<=5;x++)T.push([x,6]);for(let y=5;y>=0;y--)T.push([6,y]);T.push([7,0],[8,0]);for(let y=1;y<=5;y++)T.push([8,y]);for(let x=9;x<=14;x++)T.push([x,6]);T.push([14,7],[14,8]);for(let x=13;x>=9;x--)T.push([x,8]);for(let y=9;y<=14;y++)T.push([8,y]);T.push([7,14],[6,14]);for(let y=13;y>=9;y--)T.push([6,y]);for(let x=5;x>=0;x--)T.push([x,8]);T.push([0,7],[0,6])})();
const L=[[1,2,3,4,5].map(x=>[x,7]),[1,2,3,4,5].map(y=>[7,y]),[13,12,11,10,9].map(x=>[x,7]),[13,12,11,10,9].map(y=>[7,y])];
const OB=[[0,0],[9,0],[9,9],[0,9]],DIR=[[-1,0],[0,-1],[1,0],[0,1]];
let S=null,mode='',my=0,pn=2,peers=[],hc=null;
const show=id=>['menu','host','join','game'].forEach(k=>$(k).classList.toggle('hide',k!=id));

/* ---------- aturan permainan ---------- */
function newGame(n){const cols=n==2?[0,2]:n==3?[0,1,2]:[0,1,2,3];
 S={cols,pos:cols.map(()=>[-1,-1,-1,-1]),turn:0,dice:0,phase:'roll',win:-1,msg:'Lempar dadu untuk mulai. Butuh angka 6 untuk keluar dari kandang.'}}
const legal=(s,i,d)=>{const p=S.pos[s][i];return p<0?d==6:p+d<=56};
function roll(s){if(S.win>=0||s!=S.turn||S.phase!='roll')return;
 const d=1+Math.floor(Math.random()*6);S.dice=d;const nm=NAME[S.cols[s]];
 if([0,1,2,3].some(i=>legal(s,i,d))){S.phase='move';S.msg=nm+' dapat '+d+'. Pilih bidak yang jalan.'}
 else{S.msg=nm+' dapat '+d+', tidak ada bidak yang bisa jalan.';S.turn=(S.turn+1)%S.cols.length}}
function move(s,i){if(S.win>=0||s!=S.turn||S.phase!='move'||!legal(s,i,S.dice))return;
 const d=S.dice,p=S.pos[s][i],np=p<0?0:p+d,nm=NAME[S.cols[s]];let extra=d==6;S.pos[s][i]=np;S.msg=nm+' jalan '+d+' langkah.';
 if(np<=50){const a=(ST[S.cols[s]]+np)%52;
  if(!SAFE.has(a))S.pos.forEach((ps,o)=>{if(o!=s)ps.forEach((q,j)=>{if(q>=0&&q<=50&&(ST[S.cols[o]]+q)%52==a){ps[j]=-1;extra=true;S.msg=nm+' memakan bidak '+NAME[S.cols[o]]+'!'}})})}
 if(np==56){extra=true;S.msg=nm+' berhasil memasukkan satu bidak!'}
 if(S.pos[s].every(q=>q==56)){S.win=s;S.msg=nm+' menang!'}
 S.phase='roll';if(!extra&&S.win<0)S.turn=(S.turn+1)%S.cols.length}

/* ---------- aksi & sinkronisasi ---------- */
const canAct=()=>mode=='local'||my==S.turn;
function act(t,i){if(!S||!canAct())return;
 if(mode=='guest'){hc.send({t,i});return}
 t=='roll'?roll(S.turn):move(S.turn,i);sync()}
function sync(){if(mode=='host')peers.forEach(p=>p.ok&&p.c.send({t:'s',S}));render()}
function onHost(seat,m){if(!S||seat!=S.turn)return;m.t=='roll'?roll(seat):move(seat,m.i);sync()}

/* ---------- koneksi online (PeerJS) ---------- */
function cp(id){const e=$(id);e.select();try{navigator.clipboard.writeText(e.value)}catch(_){document.execCommand('copy')}}
const AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789',mkCode=()=>[...Array(5)].map(()=>AL[Math.floor(Math.random()*AL.length)]).join('');
function hostSetup(n,tries=0){mode='host';my=0;pn=n;peers=[];S=null;show('host');$('go').disabled=true;$('rc').value='';$('rst').textContent='Membuat ruangan…';
 const code=mkCode(),pr=new Peer('ludo-'+code);
 pr.on('open',()=>{$('rc').value=code;lobby()});
 pr.on('error',e=>{if(e.type=='unavailable-id'&&tries<5)hostSetup(n,tries+1);else $('rst').textContent='Gagal membuat ruangan ('+e.type+'). Cek internet, lalu coba lagi.'});
 pr.on('connection',c=>{if(S||peers.length>=pn-1){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300)});return}
  const seat=peers.length+1,p={c,ok:false};peers.push(p);
  c.on('open',()=>{p.ok=true;c.send({t:'hi',seat});lobby()});
  c.on('data',m=>onHost(seat,m));
  c.on('close',()=>{p.ok=false;lobby();if(S)$('msg').textContent='Satu pemain terputus. Keluar ke menu untuk mulai ulang.'})})}
function lobby(){const got=peers.filter(p=>p.ok).length;$('rst').textContent=$('rc').value?'Pemain masuk: '+got+' dari '+(pn-1)+'. Menunggu teman memasukkan kode.':'Membuat ruangan…';$('go').disabled=got<pn-1}
function startHost(){newGame(pn);show('game');sync()}
function startLocal(n){mode='local';newGame(n);show('game');render()}
function doJoin(){const code=$('jc').value.trim().toUpperCase();if(code.length!=5){$('jst').textContent='Kode ruangan terdiri dari 5 karakter.';return}
 mode='guest';$('jst').textContent='Menghubungkan…';const pr=new Peer();
 pr.on('error',e=>$('jst').textContent=e.type=='peer-unavailable'?'Ruangan tidak ditemukan. Cek kodenya, atau minta host membuat ruangan baru.':'Koneksi gagal ('+e.type+'). Cek internet, lalu coba lagi.');
 pr.on('open',()=>{hc=pr.connect('ludo-'+code,{serialization:'json',reliable:true});
  hc.on('open',()=>$('jst').textContent='Masuk. Tunggu host memulai permainan.');
  hc.on('close',()=>{const m=$('msg');if(m)m.textContent='Koneksi ke host terputus. Keluar ke menu, lalu masuk lagi.';if(!S)$('jst').textContent='Koneksi terputus. Coba masuk lagi.'});
  hc.on('data',m=>{if(m.t=='full'){$('jst').textContent='Ruangan sudah penuh atau permainan sudah dimulai.';return}if(m.t=='hi')my=m.seat;if(m.t=='s'){S=m.S;show('game');render()}})})}

/* ---------- tampilan ---------- */
function xy(s,i){const c=S.cols[s],p=S.pos[s][i];
 if(p<0)return[(OB[c][0]+2+(i%2)*2)*u,(OB[c][1]+2+(i>>1)*2)*u];
 if(p<=50){const[x,y]=T[(ST[c]+p)%52];return[(x+.5)*u,(y+.5)*u]}
 if(p<=55){const[x,y]=L[c][p-51];return[(x+.5)*u,(y+.5)*u]}
 const d=DIR[c];return[300+d[0]*26+(d[1]?(i-1.5)*9:0),300+d[1]*26+(d[0]?(i-1.5)*9:0)]}
function movable(){if(!S||S.phase!='move'||S.win>=0||!canAct())return[];return[0,1,2,3].filter(i=>legal(S.turn,i,S.dice))}
function draw(){const cv=$('cv'),g=cv.getContext('2d'),BG='#e9efe6';g.fillStyle=BG;g.fillRect(0,0,600,600);
 for(let c=0;c<4;c++){const ox=OB[c][0]*u,oy=OB[c][1]*u;g.fillStyle=COL[c];g.fillRect(ox,oy,240,240);g.fillStyle=BG;g.fillRect(ox+40,oy+40,160,160)}
 g.strokeStyle='#6f8277';g.lineWidth=1;g.textAlign='center';g.textBaseline='middle';g.font='20px sans-serif';
 const cell=(x,y,f)=>{g.fillStyle=f;g.fillRect(x*u,y*u,u,u);g.strokeRect(x*u,y*u,u,u)};
 T.forEach(([x,y],i)=>{const c=ST.indexOf(i);cell(x,y,c>=0?COL[c]:BG);if(SAFE.has(i)&&c<0){g.beginPath();g.arc(x*u+20,y*u+20,8,0,7);g.lineWidth=2;g.stroke();g.lineWidth=1}});
 L.forEach((l,c)=>l.forEach(([x,y])=>cell(x,y,COL[c])));
 const C=[[240,240],[360,240],[360,360],[240,360]];
 [[0,3],[0,1],[1,2],[2,3]].forEach(([a,b],c)=>{g.fillStyle=COL[c];g.beginPath();g.moveTo(...C[a]);g.lineTo(...C[b]);g.lineTo(300,300);g.fill()});
 if(!S)return;const cnt={},mv=movable();
 S.pos.forEach((ps,s)=>ps.forEach((p,i)=>{let[x,y]=xy(s,i);const k=x+','+y,n=cnt[k]=(cnt[k]||0)+1;x+=(n-1)*6;y-=(n-1)*6;
  if(s==S.turn&&mv.includes(i)){g.beginPath();g.arc(x,y,19,0,7);g.lineWidth=4;g.strokeStyle='#000';g.stroke();g.lineWidth=1.5}
  g.lineWidth=2;g.strokeStyle='#1d2433';g.fillStyle=COL[S.cols[s]];g.beginPath();g.ellipse(x,y+9,14,6,0,0,7);g.fill();g.stroke();g.beginPath();g.moveTo(x-8,y+8);g.lineTo(x-3,y-4);g.lineTo(x+3,y-4);g.lineTo(x+8,y+8);g.closePath();g.fill();g.stroke();g.beginPath();g.arc(x,y-8,8,0,7);g.fill();g.stroke();g.beginPath();g.arc(x-3,y-11,2.5,0,7);g.fillStyle='rgba(255,255,255,.55)';g.fill()}))}
function render(){if(!S)return;draw();const c=S.cols[S.turn];
 $('who').innerHTML=S.win>=0?'<b>Selesai</b>':'<span class="chip" style="background:'+COL[c]+(c==2?';color:#222':'')+'">'+NAME[c]+'</span>'+(mode=='local'?'giliran':(my==S.turn?'giliranmu':'giliran lawan'));
 document.documentElement.style.setProperty('--turn',COL[c]);const P=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]][S.dice];$('dice').innerHTML=[...Array(9).keys()].map(k=>P.includes(k)?'<i></i>':'<s></s>').join('');$('msg').textContent=S.msg;
 $('rb').disabled=!(S.phase=='roll'&&S.win<0&&canAct())}
$('cv').onclick=e=>{if(!S)return;const r=$('cv').getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;
 const cnt={};let hit=-1;movable().forEach(i=>{});
 S.pos[S.turn].forEach((p,i)=>{if(!movable().includes(i))return;const[px,py]=xy(S.turn,i);if(Math.hypot(px-x,py-y)<26)hit=i});
 if(hit>=0)act('move',hit)};
draw();
</script></body></html>
